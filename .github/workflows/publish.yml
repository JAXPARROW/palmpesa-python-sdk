# Publishes palmpesa-python-sdk to PyPI with Trusted Publishing (OIDC). No API tokens are stored anywhere.
#
# One-time setup: PyPI -> palmpesa-python-sdk -> Manage -> Publishing -> add a GitHub publisher:
#   owner: JAXPARROW   repo: palmpesa-python-sdk   workflow: publish.yml   environment: pypi
#
# Release: bump `version` in pyproject.toml, commit, push, then push a matching tag:
#   git tag vX.Y.Z && git push origin vX.Y.Z
# The run fails if the tag doesn't match the built package version.
name: Publish

on:
  push:
    tags: ["v*"]

permissions: {}

jobs:
  build:
    name: Build distribution
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.13"
      - name: Build and check
        run: |
          python -m pip install --upgrade pip build twine
          python -m build
          twine check --strict dist/*
      - name: Check tag matches package version
        env:
          TAG: ${{ github.ref_name }}
        run: |
          python - <<'PY'
          import glob, os, sys
          from packaging.utils import parse_wheel_filename
          from packaging.version import Version
          wheel = os.path.basename(glob.glob("dist/*.whl")[0])
          built = parse_wheel_filename(wheel)[1]
          tag = os.environ["TAG"].removeprefix("v")
          if Version(tag) != built:
              sys.exit(f"::error::Tag v{tag} does not match package version {built}")
          print(f"Tag v{tag} matches {wheel}")
          PY
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dist
          path: dist/
          if-no-files-found: error

  publish-pypi:
    name: Publish to PyPI
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/palmpesa-python-sdk
    permissions:
      id-token: write # OIDC token for Trusted Publishing; also used for attestations
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # v1.14.3
